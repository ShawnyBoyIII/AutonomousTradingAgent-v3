app:
  timezone: "America/New_York"
  state_db_path: "state/burn_in.db"
  log_dir: "logs"
  portfolio_summary_path: "state/burn_in/portfolio_summary.json"
  scan_results_path: "state/burn_in/scan_results.json"
  allow_yellow_mean_reversion: false
  min_entry_confluence_score: 4.0
  signal_mode: "parallel"
  min_timeframe_alignment: 1
  dashboard_port: 8080

market_data:
  provider: polygon
  providers: [polygon, alpaca, yfinance]  # Polygon = massive.com (rebranded); SIP-quality data via POLYGON_API_KEY
  daily_period: "1y"
  intraday_period: "5d"
  intraday_interval: "5m"
  max_data_age_hours: 72
  max_data_age_minutes: 120
  scan_deadline_minutes: 5   # AGGRESSIVE 2026-07-09 — wall-clock cap on run_scan iteration
  validate_data: true

risk:
  max_risk_per_trade_pct: 0.01
  max_daily_risk_pct: 0.03
  max_daily_orders: 3
  max_ticker_allocation_pct: 0.20
  min_reward_risk_ratio: 1.0
  use_atr_sizing: true
  atr_period: 14
  atr_multiplier: 2.0
  atr_stop_multiplier: 3.0
  min_stop_distance_pct: 3.0
  max_portfolio_heat_pct: 0.03
  max_sector_concentration_pct: 0.20
  max_shares_per_position: 50
  max_consecutive_losses: 5
  enable_drawdown_circuit_breaker: true
  ticker_reentry_cooldown_minutes: 30
  yellow_allocation_pct: 0.5

strategy:
  use_v3_signals: true
  risk_tolerance: "medium"
  min_confidence: "medium"

counter_thesis:
  enabled: false

swarm:
  enabled: false
  preset: "investment_committee"
  max_workers: 4
  swarm_weight: 0.3
  # NOTE: swarm overlay was removed from the automated burn-in scan/vote path.
  # The swarm engine and CLI (`./tradebot-local swarm`) remain as a manual
  # research/advisory tool only — see AGENTS.md.

sentiment:
  enabled: true
  context_path: "state/sentiment_context.json"
  fetch_rss: false
  rss_feeds: []
  memory_enabled: true
  memory_db_path: "state/memory.db"

session:
  eod_enabled: true
  eod_minutes_before_close: 5
  time_exit_minutes: 240

paper:
  fee_per_order: 1.0
  slippage_bps: 5
  graduation_since: "2026-07-30T11:13:07.227545-04:00"
  equity_evaluation_since: "2026-07-30T11:13:07.227545-04:00"

strategy_tracker:
  window: 20
  min_win_rate: 0.20
  full_allocation_rate: 0.50

alerts:
  slack_webhook_url: ""
  webhook_url: ""

# EOD data store (per docs/EOD_DATA_FEATURE.md)
eod_data_store:
  enabled: true
  provider: massive_flat_files
  intervals: [1d, 1m]
  backfill_years: 5
  minute_backfill_years: 1
  throttle_seconds: 0.2
  max_retries: 3
  store_root: state/data_store
  manifest_db: state/data_store.db
  s3_region: us-east-1
  # As of 2026-07-28 the massive.com flat-files endpoint
  # (https://files.massive.com) serves a valid Let's Encrypt cert
  # that validates against the system CA bundle, so default
  # verification is on. If a future rotation breaks that, pin the
  # CA explicitly via ``tls_ca_bundle`` instead of disabling
  # verification -- ``verify_tls: false`` logs a loud WARNING and
  # leaves data-in-transit unauthenticated.
  # Reference:
  #   echo | openssl s_client -servername files.massive.com \
  #     -connect files.massive.com:443 -showcerts
  verify_tls: true
  tls_ca_bundle: null
  # Massive.com's actually-hosted S3 key layout (verified via probe with
  # test API key, 2026-07). Path is {prefix}/{dataset}/{year}/{month}/{date}.csv.gz.
  # Leave null for the default ``stocks/{product}/YYYY-MM-DD.csv`` template.
  # NOTE: quotes_v1 and trades_v1 are tick-level data and may require a
  # higher-tier plan than the test key. They will 403 on insufficient plans.
  day_aggregates_key_template: "us_stocks_sip/day_aggs_v1/{year}/{month}/{date}.csv.gz"
  minute_aggregates_key_template: "us_stocks_sip/minute_aggs_v1/{year}/{month}/{date}.csv.gz"
  quotes_key_template: "us_stocks_sip/quotes_v1/{year}/{month}/{date}.csv.gz"
  trades_key_template: "us_stocks_sip/trades_v1/{year}/{month}/{date}.csv.gz"
