app:
  timezone: "America/New_York"
  state_db_path: "state/burn_in.db"
  log_dir: "logs"
  portfolio_summary_path: "state/burn_in/portfolio_summary.json"
  scan_results_path: "state/burn_in/scan_results.json"
  allow_yellow_mean_reversion: true
  min_entry_confluence_score: 4.0

market_data:
  providers:
    - alpaca
    - polygon
  daily_period: "1y"
  intraday_period: "5d"
  intraday_interval: "5m"
  max_data_age_hours: 72
  max_data_age_minutes: 75
  validate_data: true

risk:
  max_risk_per_trade_pct: 0.01
  max_daily_risk_pct: 0.03
  max_daily_orders: 150
  max_ticker_allocation_pct: 0.20
  min_reward_risk_ratio: 2.0
  use_atr_sizing: true
  atr_period: 14
  atr_multiplier: 2.5
  atr_stop_multiplier: 3.0
  min_stop_distance_pct: 3.0
  max_portfolio_heat_pct: 0.03
  max_consecutive_losses: 5
  enable_drawdown_circuit_breaker: true
  ticker_reentry_cooldown_minutes: 30
  yellow_allocation_pct: 0.5

strategy:
  use_v3_signals: true
  risk_tolerance: "high"
  min_confidence: "medium"

counter_thesis:
  enabled: true
  block_on_severity: "severe"
  aggregate_block_threshold: 0.8
  exit_on_block: false

rl:
  enabled: true
  agent_type: "PPO"
  feature_set: "standard"
  reward_function: "risk_adjusted"
  model_path: "state/rl_logs/sector_diversity/PPO_seed_789.zip"
  action_confidence_threshold: 0.4

swarm:
  enabled: true
  preset: "investment_committee"
  max_workers: 4

session:
  eod_enabled: true
  eod_minutes_before_close: 5
  time_exit_minutes: 120

paper:
  fee_per_order: 1.0
  slippage_bps: 5

alerts:
  slack_webhook_url: ""
  webhook_url: ""
