# RL Trading Configuration Example
# Copy to rl-config.yaml and customize

rl:
  enabled: false  # Set to true to use RL for signal generation
  agent_type: "PPO"  # PPO, A2C, SAC, TD3, DDPG
  feature_set: "standard"  # standard (19 features), extended (24 features)
  reward_function: "sharpe"  # pnl, sharpe, sortino
  model_path: "trained_models/rl_agent_AAPL_PPO.zip"
  training_episodes: 100
  training_timesteps: 100000
  learning_rate: 0.0003
  max_position_pct: 0.20
  action_confidence_threshold: 0.5

# Keep other settings from your main config
risk:
  max_risk_per_trade_pct: 0.01
  max_ticker_allocation_pct: 0.20
