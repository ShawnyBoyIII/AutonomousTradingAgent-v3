[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-trading-agent"
version = "0.1.0"
description = "CLI-first paper trading system for stocks and ETFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.43",
  "defusedxml>=0.7.1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "Jinja2>=3.1,<4",
  "numpy<2",
  "pandas>=2.2",
  "pyarrow>=15",
  "pydantic>=2.7",
  "plotly>=6,<7",
  "PyYAML>=6.0",
  "python-dotenv>=1.2",
  "SQLAlchemy>=2.0,<3",
  "scipy>=1.17,<1.18",
  "typer>=0.12",
  "uvicorn>=0.30,<1",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[project.scripts]
tradebot = "trading_bot.main:main"

[tool.setuptools.packages.find]
include = ["event_engine*", "trading_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]  # so stand-alone packages (e.g. event_engine) are importable.
