<!DOCTYPE html>
<html>
<body>
  <button id="btn">Expand</button>
  <div id="content"></div>
  <script>
    document.getElementById('btn').addEventListener('click', function() {
      this.remove();
      const newEl = document.createElement('div');
      newEl.textContent = 'New content';
      newEl.tabIndex = -1;
      newEl.style.outline = 'none';
      document.getElementById('content').appendChild(newEl);
      newEl.focus();
    });
  </script>
</body>
</html>
