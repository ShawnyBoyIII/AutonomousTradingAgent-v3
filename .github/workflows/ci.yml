name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: .venv/bin/python -m pip install -e ".[dev]"

      - name: Validate shell scripts
        run: bash -n tradebot-local scripts/*.sh

      - name: Compile Python modules
        run: .venv/bin/python -m compileall -q trading_bot event_engine

      - name: Initialize isolated test state
        run: |
          mkdir -p logs
          .venv/bin/python - <<'PY'
          from pathlib import Path

          from trading_bot.data.cache import MarketDataCache
          from trading_bot.portfolio.ledger import PortfolioLedger

          state_dir = Path("state")
          state_dir.mkdir(parents=True, exist_ok=True)
          ledger = PortfolioLedger(state_dir / "burn_in.db")
          ledger.initialize()
          ledger.ensure_portfolio_state()
          MarketDataCache(state_dir / "market_data_cache.db")
          (state_dir / "universe.txt").write_text("SPY\n", encoding="utf-8")
          PY

      - name: Run test suite
        run: |
          # The pre-market shell harness passes a generated script through
          # bash -c; Linux derives ARG_MAX from the process stack limit.
          ulimit -s 8192
          .venv/bin/python -m pytest -q
