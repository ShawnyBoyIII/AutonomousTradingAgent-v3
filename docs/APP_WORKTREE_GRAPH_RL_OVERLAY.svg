<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1100" viewBox="0 0 2200 1100">
  <defs>
    <style>
      .green-box { fill: #1faa4c; fill-opacity: 0.12; stroke: #1f9d4c; stroke-width: 5; rx: 6; }
      .red-box { fill: #d22d2d; fill-opacity: 0.12; stroke: #d22d2d; stroke-width: 5; rx: 6; }
      .green-note { fill: #eaf8ef; stroke: #1f9d4c; stroke-width: 2.5; rx: 12; }
      .red-note { fill: #fdecec; stroke: #d22d2d; stroke-width: 2.5; rx: 12; }
      .note-title { font: 700 17px Arial, sans-serif; fill: #111; }
      .note-text { font: 400 14px Arial, sans-serif; fill: #222; }
      .legend-text { font: 400 14px Arial, sans-serif; fill: #222; }
    </style>
  </defs>

  <image href="APP_WORKTREE_GRAPH.svg" x="0" y="0" width="2200" height="1100"/>

  <!-- Green overlays: changed or new compared with origin/main merge base. -->
  <rect x="326" y="506" width="124" height="52" class="green-box"/>
  <rect x="145" y="680" width="155" height="38" class="green-box"/>
  <rect x="846" y="246" width="128" height="36" class="green-box"/>
  <rect x="1004" y="99" width="118" height="56" class="green-box"/>
  <rect x="1030" y="436" width="130" height="48" class="green-box"/>
  <rect x="1225" y="381" width="155" height="48" class="green-box"/>
  <rect x="1578" y="850" width="155" height="38" class="green-box"/>
  <rect x="580" y="640" width="125" height="38" class="green-box"/>
  <rect x="710" y="706" width="145" height="48" class="green-box"/>
  <rect x="560" y="730" width="130" height="48" class="green-box"/>
  <rect x="525" y="785" width="140" height="48" class="green-box"/>
  <rect x="812" y="785" width="140" height="42" class="green-box"/>
  <rect x="2050" y="958" width="96" height="38" class="green-box"/>

  <!-- Red overlay: removed compared with origin/main merge base. -->
  <rect x="145" y="680" width="155" height="38" class="red-box"/>

  <!-- Summary notes. -->
  <rect x="86" y="48" width="440" height="116" class="green-note"/>
  <text x="110" y="78" class="note-title">Green: changed / new</text>
  <text x="110" y="101" class="note-text">RL benchmark, walk-forward, sector sweep, diagnostics,</text>
  <text x="110" y="122" class="note-text">provider stack, dashboard/reporting, docs, and tests changed.</text>
  <text x="110" y="143" class="note-text">P2 fix: confidence gate now uses configured benchmark cash.</text>

  <rect x="1165" y="90" width="400" height="116" class="green-note"/>
  <text x="1189" y="120" class="note-title">Config + Settings</text>
  <text x="1189" y="143" class="note-text">RL is opt-in by default; paper runtime stays runnable</text>
  <text x="1189" y="164" class="note-text">without ignored state/ model artifacts.</text>
  <text x="1189" y="185" class="note-text">Benchmark knobs remain: cash, max shares, stop, target.</text>

  <rect x="1005" y="675" width="455" height="130" class="green-note"/>
  <text x="1029" y="705" class="note-title">RL confidence path</text>
  <text x="1029" y="728" class="note-text">Shared feature creation, fixed-model walk-forward,</text>
  <text x="1029" y="749" class="note-text">diagnostics, and multi-symbol RL backtest path updated.</text>
  <text x="1029" y="770" class="note-text">Guide now blocks promotion on provider/daily fallback.</text>
  <text x="1029" y="791" class="note-text">Current sector proof: 23 trades, +6.58%, PF 1.84.</text>

  <rect x="330" y="830" width="390" height="92" class="green-note"/>
  <text x="354" y="860" class="note-title">Scripts</text>
  <text x="354" y="883" class="note-text">Added burn-in RL and sector diversity workflows.</text>
  <text x="354" y="904" class="note-text">Removed old quick-train script.</text>

  <rect x="760" y="830" width="360" height="92" class="green-note"/>
  <text x="784" y="860" class="note-title">Tests</text>
  <text x="784" y="883" class="note-text">Added RL feature, label, backtest, CLI, and sector</text>
  <text x="784" y="904" class="note-text">regressions, including configured-cash gate coverage.</text>

  <rect x="1125" y="255" width="395" height="92" class="green-note"/>
  <text x="1149" y="285" class="note-title">Market data</text>
  <text x="1149" y="308" class="note-text">Provider stack now includes Alpaca, Polygon, Finnhub.</text>
  <text x="1149" y="329" class="note-text">P3 fix: fetch_bars no longer performs hidden DB writes.</text>

  <rect x="1550" y="36" width="325" height="70" class="red-note"/>
  <text x="1572" y="64" class="note-title">Red: removed</text>
  <text x="1572" y="86" class="note-text">scripts/quick-train.sh</text>

  <!-- Legend. -->
  <rect x="1855" y="48" width="18" height="18" fill="#eaf8ef" stroke="#1f9d4c" stroke-width="2"/>
  <text x="1882" y="63" class="legend-text">changed or new</text>
  <rect x="1855" y="76" width="18" height="18" fill="#fdecec" stroke="#d22d2d" stroke-width="2"/>
  <text x="1882" y="91" class="legend-text">removed</text>
</svg>
