<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <style>
      .green-box { fill: rgba(31, 170, 76, 0.12); stroke: #1f9d4c; stroke-width: 5; rx: 14; }
      .red-box { fill: rgba(210, 45, 45, 0.12); stroke: #d22d2d; stroke-width: 5; rx: 14; }
      .green-note { fill: #eaf8ef; stroke: #1f9d4c; stroke-width: 2.5; rx: 12; }
      .red-note { fill: #fdecec; stroke: #d22d2d; stroke-width: 2.5; rx: 12; }
      .note-title { font: 700 17px Arial, sans-serif; fill: #111; }
      .note-text { font: 400 14px Arial, sans-serif; fill: #222; }
      .legend { font: 700 16px Arial, sans-serif; fill: #111; }
      .legend-text { font: 400 14px Arial, sans-serif; fill: #222; }
    </style>
  </defs>

  <image href="APP_WORKTREE_MAP.svg" x="0" y="0" width="1800" height="1180"/>

  <!-- Green overlays: new or changed in the current RL confidence work -->
  <rect x="1180" y="140" width="260" height="74" class="green-box"/>
  <rect x="255" y="765" width="235" height="74" class="green-box"/>
  <rect x="1125" y="765" width="260" height="74" class="green-box"/>
  <rect x="1430" y="765" width="240" height="74" class="green-box"/>

  <!-- New map items not present as first-class boxes in the base map -->
  <rect x="92" y="28" width="360" height="86" class="green-note"/>
  <text x="116" y="57" class="note-title">Green overlay: changed / new</text>
  <text x="116" y="80" class="note-text">RL benchmark sizing, action decoding, sector sweep</text>
  <text x="116" y="101" class="note-text">and focused regression tests were updated.</text>

  <rect x="1030" y="72" width="355" height="108" class="green-note"/>
  <text x="1054" y="101" class="note-title">Config/settings updated</text>
  <text x="1054" y="124" class="note-text">config.yaml + RLSettings now expose:</text>
  <text x="1054" y="145" class="note-text">cash, max_shares, stop, profit target</text>
  <text x="1054" y="166" class="note-text">for paper RL benchmarks.</text>

  <rect x="1378" y="846" width="330" height="122" class="green-note"/>
  <text x="1402" y="875" class="note-title">RL confidence changes</text>
  <text x="1402" y="898" class="note-text">multi-symbol RL runs once, not per symbol</text>
  <text x="1402" y="919" class="note-text">model metadata drives action_scheme</text>
  <text x="1402" y="940" class="note-text">sector model benchmark: 23 trades, +6.58%</text>

  <rect x="845" y="846" width="360" height="122" class="green-note"/>
  <text x="869" y="875" class="note-title">Tests updated</text>
  <text x="869" y="898" class="note-text">tests/test_rl_backtest.py</text>
  <text x="869" y="919" class="note-text">tests/test_rl_env.py</text>
  <text x="869" y="940" class="note-text">tests/test_sector_diversity_rl.py</text>

  <rect x="148" y="736" width="255" height="28" class="green-note"/>
  <text x="162" y="756" class="note-text">backtest/runner.py corrected</text>

  <rect x="1088" y="736" width="318" height="28" class="green-note"/>
  <text x="1102" y="756" class="note-text">rl/features.py + observer/env/backtest tuned</text>

  <rect x="1212" y="216" width="295" height="28" class="green-note"/>
  <text x="1226" y="236" class="note-text">sector_diversity_rl.py sweep support</text>

  <!-- Red overlays: removed cleanup items from the worktree map context -->
  <rect x="520" y="1110" width="405" height="54" class="red-note"/>
  <text x="544" y="1133" class="note-title">Red overlay: removed cleanup</text>
  <text x="544" y="1153" class="note-text">macOS .DS_Store artifacts were removed from tracked docs/scripts/package paths.</text>

  <rect x="1482" y="20" width="250" height="70" class="red-note"/>
  <text x="1504" y="48" class="note-title">Removed</text>
  <text x="1504" y="70" class="note-text">.DS_Store tracked noise</text>

  <!-- Legend -->
  <rect x="1478" y="102" width="18" height="18" fill="#eaf8ef" stroke="#1f9d4c" stroke-width="2"/>
  <text x="1505" y="117" class="legend-text">changed or new</text>
  <rect x="1478" y="130" width="18" height="18" fill="#fdecec" stroke="#d22d2d" stroke-width="2"/>
  <text x="1505" y="145" class="legend-text">removed</text>
</svg>
