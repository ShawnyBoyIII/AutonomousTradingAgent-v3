<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1100" viewBox="0 0 2200 1100">
  <defs>
    <style>
      .page { fill: #fff; }
      .frame { fill: #fff; stroke: #dedede; stroke-width: 3; rx: 36; }
      .group { fill: #fff; stroke: #ededed; stroke-width: 1.5; }
      .label { font: 400 13px Arial, sans-serif; fill: #111; }
      .tiny { font: 400 10px Arial, sans-serif; fill: #111; }
      .box { fill: #fff; stroke: #e4e4e4; stroke-width: 1.5; rx: 2; }
      .core { fill: #fff; stroke: #cfcfcf; stroke-width: 1.7; rx: 2; }
      .arrow { stroke: #111; stroke-width: 1.1; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #111; stroke-width: 1.1; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow); }
      .light { stroke: #777; stroke-width: 0.9; fill: none; marker-end: url(#arrow-light); }
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#111"/>
    </marker>
    <marker id="arrow-light" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#777"/>
    </marker>
